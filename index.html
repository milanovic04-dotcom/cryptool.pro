<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTOOL | The Balkan Crypto Authority</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --deep-blue: #0a192f;
            --gold: #ffc107;
            --accent-red: #d32f2f;
            --text-silver: #ccd6f6;
            --glass-bg: rgba(10, 25, 47, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--deep-blue);
            color: white;
            overflow: hidden;
        }

        /* --- АНИМИРАНА ПОЗАДИНА --- */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- ЛЕБДЕЧКИ ЛОГОА (CRYPTO RAIN) --- */
        .crypto-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .coin {
            position: absolute;
            opacity: 0.2;
            animation: floatUp 12s infinite linear;
            font-size: 1.8rem;
            color: var(--neon-blue);
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* --- ГЛАВНА КАРТИЧКА --- */
        main {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 3rem 2rem;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
        }

        /* ЛОГО ДЕЛ */
        .brand-header {
            margin-bottom: 2rem;
        }

        .logo-main {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logo-main i {
            color: var(--accent-red);
            filter: drop-shadow(0 0 10px rgba(211, 47, 47, 0.5));
        }

        .powered-by {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-silver);
            margin-top: 5px;
            opacity: 0.7;
        }

        /* COMING SOON ТЕКСТ */
        .status-badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .main-message {
            font-size: 1.4rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            color: var(--text-silver);
        }

        .main-message b {
            color: white;
            font-weight: 800;
            border-bottom: 2px solid var(--gold);
        }

        /* ФОРМА ЗА ПРИСТАП */
        .access-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 0 auto;
        }

        input[type="password"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            color: white;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border-color: var(--neon-blue);
            background: rgba(255, 255, 255, 0.1);
        }

        .enter-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .enter-btn:hover {
            background: #b71c1c;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4);
        }

        /* ЛИНКОВИ ЗА ЈАЗИК */
        .lang-switcher {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .lang-switcher a {
            color: var(--text-silver);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 800;
            opacity: 0.5;
            transition: 0.3s;
        }

        .lang-switcher a:hover, .lang-switcher a.active {
            opacity: 1;
            color: var(--neon-blue);
        }

        /* ФУТЕР */
        footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .social-icons a {
            color: var(--text-silver);
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--neon-blue);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div class="crypto-rain" id="coin-container"></div>

    <main>
        <div class="auth-card">
            <div class="lang-switcher">
                <a href="#" class="active">ENGLISH</a>
                <a href="#">МАКЕДОНСКИ</a>
                <a href="#">SRPSKI</a>
                <a href="#">SHQIP</a>
            </div>

            <div class="brand-header">
                <div class="status-badge">COMING SOON</div>
                <div class="logo-main">
                    <i class="fa-solid fa-screwdriver-wrench"></i> CRYPTOOL
                </div>
                <div class="powered-by">Powered by Kapital Media Group</div>
            </div>

            <p class="main-message">
                The only informant and educator in the Balkans for blockchain and crypto. <br>
                <b>WE ARE BUILDING THE FUTURE.</b>
            </p>

            <form class="access-container" onsubmit="return validateAccess(event)">
                <input type="password" id="passCode" placeholder="Enter preview code">
                <button type="submit" class="enter-btn">Enter Preview</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-discord"></i></a>
        </div>
        <p style="font-size: 0.7rem; color: var(--text-silver); letter-spacing: 1px;">
            © 2026 CRYPTOOL TEAM | <a href="https://kapital.mk" style="color: inherit; text-decoration: none;">KAPITAL MEDIA GROUP</a>
        </p>
    </footer>

    <script>
        /* --- 1. КРИПТО ДОЖД (BTC, ETH, SOL, ADA, TRX, BNB, SUI) --- */
        const coins = [
            'fa-brands fa-bitcoin', 
            'fa-brands fa-ethereum', 
            'fa-solid fa-litecoin-sign',
            'fa-solid fa-coins' // Placeholder за други
        ];
        
        function createCoin() {
            const container = document.getElementById('coin-container');
            const coin = document.createElement('i');
            const randomIcon = coins[Math.floor(Math.random() * coins.length)];
            
            coin.className = `${randomIcon} coin`;
            coin.style.left = Math.random() * 100 + "vw";
            coin.style.animationDuration = (Math.random() * 5 + 7) + "s";
            coin.style.fontSize = (Math.random() * 1 + 1) + "rem";
            
            container.appendChild(coin);
            setTimeout(() => coin.remove(), 12000);
        }
        setInterval(createCoin, 400);

        /* --- 2. CANVAS BLOCKCHAIN NODES BACKGROUND --- */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        /* --- 3. ВАЛИДАЦИЈА НА ЛОЗИНКА --- */
        function validateAccess(event) {
            event.preventDefault();
            const pass = document.getElementById('passCode').value;
            if (pass === "cryptool2026") {
                alert("Access Granted. Redirecting to admin preview...");
                // Тука ќе се додаде линк до реалната страна
            } else {
                alert("Incorrect code. Please try again.");
            }
            return false;
        }
    </script>
</body>
</html>
